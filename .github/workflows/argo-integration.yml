name: Argo Rollouts Integration
on:
  push:
    branches: [main]
    paths:
      - deploy/argo-rollout.yaml
      - lab/argo_smoke.py
      - lab/argo_metrics_smoke.py
      - deploy/prometheus.yaml
      - guard/remediation.py
      - .github/workflows/argo-integration.yml
  pull_request:
    paths:
      - deploy/argo-rollout.yaml
      - lab/argo_smoke.py
      - guard/remediation.py
      - .github/workflows/argo-integration.yml
permissions:
  contents: read
concurrency:
  group: infraguard-argo-${{ github.ref }}
  cancel-in-progress: true
jobs:
  argo-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Create Kind cluster
        uses: helm/kind-action@v1.13.0
        with:
          cluster_name: infraguard
          config: deploy/kind-config.yaml
          wait: 120s
      - name: Build and load test image
        run: |
          docker build -t infraguard-lab:dev .
          kind load docker-image infraguard-lab:dev --name infraguard
      - name: Install pinned Argo Rollouts controller
        run: |
          kubectl --context kind-infraguard create namespace argo-rollouts
          kubectl --context kind-infraguard apply --server-side --force-conflicts -n argo-rollouts -f https://github.com/argoproj/argo-rollouts/releases/download/v1.10.2/install.yaml
          kubectl --context kind-infraguard -n argo-rollouts rollout status deployment/argo-rollouts --timeout=180s
      - name: Create isolated lab and canary
        run: |
          kubectl --context kind-infraguard apply -f deploy/lab.yaml
          kubectl --context kind-infraguard apply -f deploy/argo-rollout.yaml
          kubectl --context kind-infraguard apply -f deploy/prometheus.yaml
          kubectl --context kind-infraguard -n infraguard-lab rollout status deployment/infraguard-fault-lab --timeout=180s
          kubectl --context kind-infraguard -n infraguard-lab rollout status deployment/infraguard-prometheus --timeout=180s
      - name: Verify live canary abort
        run: python -m lab.argo_metrics_smoke
      - name: Upload evidence and audit records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: infraguard-argo-evidence
          path: |
            argo-metrics-report.json
            argo-abort-audit.jsonl
          if-no-files-found: ignore
          retention-days: 14
      - name: Diagnostics on failure
        if: failure()
        run: |
          kubectl --context kind-infraguard -n infraguard-lab get rollouts,pods,replicasets -o wide || true
          kubectl --context kind-infraguard -n infraguard-lab describe rollout checkout || true
          kubectl --context kind-infraguard -n infraguard-lab describe pods || true
          kubectl --context kind-infraguard -n argo-rollouts logs deployment/argo-rollouts --tail=120 || true
