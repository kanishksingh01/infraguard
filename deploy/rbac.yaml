# Optional read-only service account for dedicated InfraGuard namespace.
# Apply only in an isolated lab environment. Never grants workload mutation.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: infraguard-observer
  namespace: infraguard-lab
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: infraguard-observer
  namespace: infraguard-lab
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["rollouts"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["events", "pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: infraguard-observer
  namespace: infraguard-lab
subjects:
  - kind: ServiceAccount
    name: infraguard-observer
    namespace: infraguard-lab
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: infraguard-observer
