# Read-only persistent monitor for disposable Kind. Never auto-aborts Rollouts.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: infraguard-monitor
  namespace: infraguard-lab
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: infraguard-monitor
  namespace: infraguard-lab
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["rollouts"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: infraguard-monitor
  namespace: infraguard-lab
subjects:
  - kind: ServiceAccount
    name: infraguard-monitor
    namespace: infraguard-lab
roleRef:
  kind: Role
  name: infraguard-monitor
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: infraguard-monitor
  namespace: infraguard-lab
spec:
  replicas: 1
  selector:
    matchLabels: {app: infraguard-monitor}
  template:
    metadata:
      labels: {app: infraguard-monitor}
    spec:
      serviceAccountName: infraguard-monitor
      securityContext:
        runAsNonRoot: true
        runAsUser: 10002
        runAsGroup: 10002
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: monitor
          image: infraguard-monitor:dev
          imagePullPolicy: IfNotPresent
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {cpu: 150m, memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
